name: Upload CSV1 and CSV2 images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csv12-data

      - name: Upload CSV1 and CSV2 card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in csv1-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading CSV1 $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Eternal Birth CSV1/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
          for f in csv2-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading CSV2 $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Miracle Journey CSV2/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
