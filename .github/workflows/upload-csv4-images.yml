name: Upload CSV4 images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csv4-data

      - name: Upload CSV4 card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in csv4-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading CSV4 $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Reward Round CSV4/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
