name: Upload Black Bolt and White Flare images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: black-bolt-white-flare-data

      - name: Upload Black Bolt card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in black-bolt-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading Black Bolt $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Black Bolt/Cards/$name" --file="$f" --content-type=image/webp --remote
          done

      - name: Upload White Flare card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in white-flare-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading White Flare $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/White Flare/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
