name: Upload Gem Vol 7 card images to R2

# Temporary, one-time job — uploads the 196 card images already committed
# on this branch (public/sets/gem-vol-7/cards/*.webp) into the same R2
# bucket the admin product-image uploader already uses, under
# Chinese/Gem 7/Cards/. Reuses the existing deploy-time Cloudflare secrets
# rather than introducing new credentials. Delete this workflow file once
# the upload has run successfully.
on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gem-vol-7-data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload card images to R2
        run: |
          set -euo pipefail
          for f in public/sets/gem-vol-7/cards/*.webp; do
            name="$(basename "$f")"
            echo "Uploading $name"
            npx wrangler r2 object put "ebicollectibles-product-images/Chinese/Gem 7/Cards/$name" --file="$f" --content-type="image/webp" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
