name: Upload Collect 151 images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collect-151-data

      - name: Upload Collect 151 card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in collect-151-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading Collect 151 $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Collect 151/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
