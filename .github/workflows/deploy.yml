name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers target)
        run: npm run build
        env:
          # Square's application/location id and environment aren't secret —
          # they get baked straight into the client bundle at build time, the
          # same way a Stripe publishable key would be. Set them as GitHub
          # Actions repository *variables* (not secrets) under Settings →
          # Secrets and variables → Actions → Variables when ready to go
          # live — until then these are unset and checkout stays in test
          # mode, same as always. The real secret, SQUARE_ACCESS_TOKEN, is a
          # Cloudflare Worker secret (see README-DEPLOY.md), never a GitHub
          # Actions value, since it's read at request time, not build time.
          VITE_SQUARE_APPLICATION_ID: ${{ vars.VITE_SQUARE_APPLICATION_ID }}
          VITE_SQUARE_LOCATION_ID: ${{ vars.VITE_SQUARE_LOCATION_ID }}
          VITE_SQUARE_ENVIRONMENT: ${{ vars.VITE_SQUARE_ENVIRONMENT }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .output/server
          # Nitro's cloudflare_module preset also writes a deploy config to
          # <repo-root>/.wrangler/deploy/config.json, which sits outside this
          # workingDirectory. Wrangler then finds two config files with
          # different base paths and refuses to pick one — pointing it at
          # wrangler.json explicitly resolves the ambiguity.
          command: deploy --config wrangler.json
