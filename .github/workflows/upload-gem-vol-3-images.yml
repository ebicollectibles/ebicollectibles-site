name: Upload Gem Vol 3 images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gem-vol-3-data

      - name: Upload card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in gem-vol-3-images/cards/*.webp; do
            name=$(basename "$f")
            echo "Uploading $name"
            npx --yes wrangler@4 r2 object put "ebicollectibles-product-images/Chinese/Gem 3/Cards/$name" --file="$f" --content-type=image/webp --remote
          done
