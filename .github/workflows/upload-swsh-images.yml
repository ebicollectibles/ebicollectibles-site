name: Upload Sword & Shield images to R2

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swsh-data

      - name: Upload Simplified Chinese Sword & Shield card images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install -g wrangler@4 >/dev/null
          find swsh-images -name '*.webp' | sort > files.txt
          echo "$(wc -l < files.txt) files"
          up() {
            f="$1"; set_dir=$(basename "$(dirname "$f")"); name=$(basename "$f")
            for a in 1 2 3; do
              wrangler r2 object put "ebicollectibles-product-images/Chinese/Sword and Shield/$set_dir/Cards/$name" --file="$f" --content-type=image/webp --remote >/dev/null 2>&1 && { echo "ok $set_dir/$name"; return 0; }
              sleep $((a*3))
            done
            echo "FAILED $set_dir/$name"; return 1
          }
          export -f up
          xargs -P 8 -I{} bash -c 'up "$@"' _ {} < files.txt | tee log.txt
          echo "uploaded $(grep -c '^ok ' log.txt) of $(wc -l < files.txt)"
          ! grep -q '^FAILED' log.txt
